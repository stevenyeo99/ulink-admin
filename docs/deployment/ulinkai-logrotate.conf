# ulink-api log files — installed as /etc/logrotate.d/ulinkai (root, 644). Debian's daily cron runs logrotate.
# Daily: today's file is renamed combined.log-YYYYMMDD and a fresh one started; older days are gzipped;
# 30 days kept. copytruncate: ulink-api keeps its file open, so the file is copied then emptied in place
# (a few lines written during the copy can be lost — acceptable for these logs).
/home/ulinkai/uat/ulink-api/logs/*.log /home/ulinkai/prod/ulink-api/logs/*.log {
    su ulinkai ulinkai
    daily
    rotate 30
    dateext
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}

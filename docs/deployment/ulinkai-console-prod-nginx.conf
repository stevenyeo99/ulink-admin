# ULINK PROD console (+ /api proxy to ulink-api-prod) — installed as /etc/nginx/conf.d/ulinkai-console-prod-nginx.conf (root, 644).
# Same as ulinkai-console-uat-nginx.conf with listen 5174, root /home/ulinkai/prod/..., proxy to 3089.
# A separate file on its own port: other sites' config is never edited. Apply with: nginx -t && systemctl reload nginx
server {
    listen 5174;                                  # all interfaces on purpose: binding to the Tailscale IP would stop
                                                  # nginx (every site) from starting at boot if tailscale0 is not up yet
    root /home/ulinkai/prod/ulink-console/dist;
    client_max_body_size 30m;                     # attachment uploads

    location / {
        try_files $uri /index.html;               # SPA routing: deep links return the app
    }

    # /api/jobs/* is NOT blocked: the console itself calls it (run pipeline, latest run status). Those routes have no
    # auth in ulink-api (cron uses them) — so anyone who can reach this port can run jobs (BACKLOG B9). Outline-only.
    location /api/ {
        proxy_pass http://127.0.0.1:3089;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;                  # LLM calls can be slow
    }
}

# Public domain (2026-11-25), behind the Cloudflare proxy. Same as the UAT domain blocks, with the prod root and port.
# nginx picks these blocks by server_name on 80/443, next to the other sites on this server.
# Certificate: Let's Encrypt, issued with: certbot certonly --nginx -d ai-stp.ulinkmyanmar.com.mm
#   certbot renews it by itself (test: certbot renew --dry-run). certonly = certbot never edits this file.
# /api/jobs/* has no login (BACKLOG B9), so on this public domain anyone can run prod jobs.
server {
    listen 80;
    server_name ai-stp.ulinkmyanmar.com.mm;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ai-stp.ulinkmyanmar.com.mm;
    ssl_certificate     /etc/letsencrypt/live/ai-stp.ulinkmyanmar.com.mm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-stp.ulinkmyanmar.com.mm/privkey.pem;

    # Real user IP from Cloudflare, so the API rate limit counts users, not Cloudflare. List: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    root /home/ulinkai/prod/ulink-console/dist;
    client_max_body_size 30m;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3089;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

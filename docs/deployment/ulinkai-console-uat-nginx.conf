# ULINK UAT console (+ /api proxy to ulink-api-uat) — installed as /etc/nginx/conf.d/ulinkai-console-uat-nginx.conf (root, 644).
# Prod: copy to ulinkai-console-prod-nginx.conf with listen 5174, root /home/ulinkai/prod/..., proxy to 3089.
# A separate file on its own port: other sites' config is never edited. Apply with: nginx -t && systemctl reload nginx
server {
    listen 5173;                                  # all interfaces on purpose: binding to the Tailscale IP would stop
                                                  # nginx (every site) from starting at boot if tailscale0 is not up yet
    root /home/ulinkai/uat/ulink-console/dist;
    client_max_body_size 30m;                     # attachment uploads

    location / {
        try_files $uri /index.html;               # SPA routing: deep links return the app
    }

    # /api/jobs/* is NOT blocked: the console itself calls it (run pipeline, latest run status). Those routes have no
    # auth in ulink-api (cron uses them) — so anyone who can reach this port can run jobs. UAT: Outline-only.
    location /api/ {
        proxy_pass http://127.0.0.1:3088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;                  # LLM calls can be slow
    }
}
